workflows:
  android-workflow:
    name: Android Release
    max_build_duration: 60
    instance_type: mac_mini_m1
    
    environment:
      android_signing:
        - donekaro_keystore
      groups:
        - firebase_credentials
      vars:
        PACKAGE_NAME: "com.usmanghani.donekaro"
      flutter: stable
      java: 17
    
    scripts:
      - name: Set up key.properties
        script: |
          echo "storePassword=$CM_KEYSTORE_PASSWORD" >> "$CM_BUILD_DIR/android/key.properties"
          echo "keyPassword=$CM_KEY_PASSWORD" >> "$CM_BUILD_DIR/android/key.properties"
          echo "keyAlias=$CM_KEY_ALIAS" >> "$CM_BUILD_DIR/android/key.properties"
          echo "storeFile=$CM_KEYSTORE_PATH" >> "$CM_BUILD_DIR/android/key.properties"
      
      - name: Set up google-services.json
        script: |
          echo $GOOGLE_SERVICES_JSON | base64 --decode > $CM_BUILD_DIR/android/app/google-services.json
      
      - name: Set up firebase_options.dart
        script: |
          echo $FIREBASE_OPTIONS_DART | base64 --decode > $CM_BUILD_DIR/lib/firebase_options.dart
      
      - name: Get Flutter packages
        script: |
          flutter pub get
      
      - name: Build APK (debug)
        script: |
          flutter build apk --debug
      
      - name: Build AAB (release)
        script: |
          flutter build appbundle --release
    
    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
      - flutter_drive.log
    
    publishing:
      email:
        recipients:
          - usmanghani@example.com  # Update this email
        notify:
          success: true
          failure: true
      
      # Uncomment below to auto-publish to Play Store
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal
      #   submit_as_draft: true

  android-debug:
    name: Android Debug Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    
    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
    
    environment:
      groups:
        - firebase_credentials
      flutter: stable
      java: 17
    
    scripts:
      - name: Set up google-services.json
        script: |
          echo $GOOGLE_SERVICES_JSON | base64 --decode > $CM_BUILD_DIR/android/app/google-services.json
      
      - name: Set up firebase_options.dart
        script: |
          echo $FIREBASE_OPTIONS_DART | base64 --decode > $CM_BUILD_DIR/lib/firebase_options.dart
      
      - name: Get Flutter packages
        script: |
          flutter pub get
      
      - name: Analyze code
        script: |
          flutter analyze --no-fatal-infos
      
      - name: Build debug APK
        script: |
          flutter build apk --debug
    
    artifacts:
      - build/**/outputs/**/*.apk
